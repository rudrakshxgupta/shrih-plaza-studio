name: Daily Shrih Plaza post

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 India time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Make today's post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DAILY_EMAIL_TO: ${{ secrets.DAILY_EMAIL_TO }}
        run: python scripts/daily_run.py
      - name: Save today's post to the repo for review
        run: |
          git config user.name "shrih-daily-bot"
          git config user.email "shrih-daily-bot@users.noreply.github.com"
          git add outputs/daily
          git commit -m "Daily post $(date -u +%F)" || echo "nothing new"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-post
          path: outputs/daily/
          retention-days: 30
